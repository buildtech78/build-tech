<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification en deux étapes — Build.Tech</title>
<meta name="theme-color" content="#10233A">
<link rel="icon" href="./assets/img/favicon.png" type="image/png">
<link rel="stylesheet" href="./assets/css/style.css">
<script>
  (function(){ var p=localStorage.getItem("buildtech-theme")||"system";
  var r=p==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):p;
  document.documentElement.setAttribute("data-theme", r); })();
</script>
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="./index.html" class="brand">
      <img src="./assets/img/logo.png" alt="Logo Build.Tech" class="logo-mark">
      Build<span class="dot">.</span>Tech
    </a>
    <div class="nav-actions"><div id="navAuthArea" class="nav-actions"></div></div>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <form class="form-card" id="mfaForm" novalidate>
        <h1>Vérification en deux étapes</h1>
        <p class="form-sub">Saisis le code à 6 chiffres généré par ton application d'authentification.</p>
        <div id="mfaAlert"></div>
        <div class="field">
          <label for="code">Code</label>
          <input type="text" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnVerify">Vérifier</button>
      </form>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./assets/js/config.js"></script>
<script src="./assets/js/supabase-client.js"></script>
<script src="./assets/js/utils.js"></script>
<script src="./assets/js/theme.js"></script>
<script src="./assets/js/nav.js"></script>
<script src="./assets/js/mfa-verify.js"></script>
</body>
</html>
