<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Build.Tech</title>
<meta name="theme-color" content="#10233A">
<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/css/style.css">
<script>
  (function(){ var p=localStorage.getItem("buildtech-theme")||"system";
  var r=p==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):p;
  document.documentElement.setAttribute("data-theme", r); })();
</script>
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="./index.html" class="brand">
      <img src="./assets/img/logo-placeholder.svg" alt="Logo Build.Tech">
      Build<span class="dot">.</span>Tech
    </a>
    <ul class="nav-links">
      <li><a href="./index.html">Accueil</a></li>
      <li><a href="./services.html">Services</a></li>
      <li><a href="./components.html">Composants</a></li>
      <li><a href="./contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <div id="navAuthArea" class="nav-actions"></div>
    </div>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <form class="form-card" id="resetForm" novalidate>
        <h1>Nouveau mot de passe</h1>
        <p class="form-sub">Choisissez un nouveau mot de passe pour votre compte.</p>
        <div id="resetAlert"></div>
        <div class="field" id="fieldPassword">
          <label for="password">Nouveau mot de passe</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
          <div class="field-hint">6 caractères minimum.</div>
          <div class="field-error">Le mot de passe doit contenir au moins 6 caractères.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnReset">Mettre à jour le mot de passe</button>
      </form>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./assets/js/config.js"></script>
<script src="./assets/js/supabase-client.js"></script>
<script src="./assets/js/utils.js"></script>
<script src="./assets/js/theme.js"></script>
<script src="./assets/js/auth.js"></script>
</body>
</html>
