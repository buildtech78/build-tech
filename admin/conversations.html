<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversations — Administration Build.Tech</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#10233A">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<script>
  (function(){ var p=localStorage.getItem("buildtech-theme")||"system";
  var r=p==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):p;
  document.documentElement.setAttribute("data-theme", r); })();
</script>
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="../index.html" class="brand">
      <img src="../assets/img/logo.png" alt="Logo Build.Tech" class="logo-mark">
      Build<span class="dot">.</span>Tech <span class="badge badge-muted" style="margin-left:6px;">Admin</span>
    </a>
    <div class="nav-actions">
      <button type="button" class="icon-btn" id="btnThemeToggle" title="Changer de thème" aria-label="Changer de thème">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div id="navAuthArea" class="nav-actions"></div>
    </div>
  </div>
</header>

<div class="admin-shell">
  <nav class="admin-sidebar">
    <a href="./index.html">📊 Tableau de bord</a>
    <a href="./services.html">🛠️ Services</a>
    <a href="./components.html">🧩 Composants</a>
    <a href="./conversations.html" class="active">💬 Conversations</a>
    <a href="./users.html">👤 Utilisateurs</a>
    <a href="./admins.html">🔑 Administrateurs</a>
    <a href="./settings.html">⚙️ Paramètres du site</a>
  </nav>

  <main class="admin-main" style="max-width:none;">
    <h1 style="font-size:1.5rem;">Conversations</h1>

    <div class="filters-bar">
      <select id="fStatus">
        <option value="">Tous statuts</option>
        <option value="open">Ouvertes</option>
        <option value="closed">Fermées</option>
      </select>
      <label class="checkbox"><input type="checkbox" id="fUnreadOnly"> Non lues uniquement</label>
    </div>

    <div class="chat-layout" style="margin-top:16px;">
      <div class="chat-list" id="chatList">
        <div class="loading-row" style="padding:16px;"><span class="spinner"></span> Chargement…</div>
      </div>
      <div class="chat-thread" id="chatThread">
        <div class="empty-state"><div class="icon">💬</div><p>Sélectionnez une conversation.</p></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/admin-guard.js"></script>
<script src="../assets/js/chat-core.js"></script>
<script src="../assets/js/admin-conversations.js"></script>
</body>
</html>
