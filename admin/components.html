<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Composants — Administration Build.Tech</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#10233A">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<script>
  (function(){ var p=localStorage.getItem("buildtech-theme")||"system";
  var r=p==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):p;
  document.documentElement.setAttribute("data-theme", r); })();
</script>
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="../index.html" class="brand">
      <img src="../assets/img/logo-placeholder.svg" alt="Logo Build.Tech">
      Build<span class="dot">.</span>Tech <span class="badge badge-muted" style="margin-left:6px;">Admin</span>
    </a>
    <div class="nav-actions">
      <button type="button" class="icon-btn" id="btnThemeToggle" title="Changer de thème" aria-label="Changer de thème">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div id="navAuthArea" class="nav-actions"></div>
    </div>
  </div>
</header>

<div class="admin-shell">
  <nav class="admin-sidebar">
    <a href="./index.html">📊 Tableau de bord</a>
    <a href="./services.html">🛠️ Services</a>
    <a href="./components.html" class="active">🧩 Composants</a>
    <a href="./conversations.html">💬 Conversations</a>
    <a href="./users.html">👤 Utilisateurs</a>
    <a href="./admins.html">🔑 Administrateurs</a>
    <a href="./settings.html">⚙️ Paramètres du site</a>
  </nav>

  <main class="admin-main">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div>
        <h1 style="font-size:1.5rem; margin-bottom:2px;">Composants</h1>
        <p style="margin:0;">Gérez le catalogue affiché sur la page publique.</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn btn-ghost" id="btnManageCategories">Catégories</button>
        <button type="button" class="btn btn-primary" id="btnNewComponent">+ Ajouter un composant</button>
      </div>
    </div>

    <div class="table-wrap" style="margin-top:20px;">
      <table class="data-table">
        <thead>
          <tr><th>Photo</th><th>Titre</th><th>Catégorie</th><th>Prix</th><th>Statut</th><th>Actions</th></tr>
        </thead>
        <tbody id="componentsTableBody">
          <tr><td colspan="6">Chargement…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-overlay hidden" id="componentModalOverlay">
  <div class="modal">
    <h2 id="componentModalTitle">Ajouter un composant</h2>
    <form id="componentForm">
      <input type="hidden" id="componentId">
      <input type="hidden" id="componentExistingImagePath">
      <div class="field">
        <label for="componentTitle">Titre</label>
        <input type="text" id="componentTitle" required maxlength="150">
      </div>
      <div class="field">
        <label for="componentDescription">Description</label>
        <textarea id="componentDescription" maxlength="2000"></textarea>
      </div>
      <div class="field">
        <label for="componentPrice">Prix (€)</label>
        <input type="number" id="componentPrice" min="0" step="0.01" required>
      </div>
      <div class="field">
        <label for="componentCategory">Catégorie</label>
        <select id="componentCategory"><option value="">Aucune</option></select>
      </div>
      <div class="field">
        <label for="componentImage">Photo (JPG/PNG/WEBP, 5 Mo max)</label>
        <input type="file" id="componentImage" accept="image/png,image/jpeg,image/webp">
        <div id="componentImagePreviewWrap" style="margin-top:8px;"></div>
      </div>
      <div class="field">
        <label><input type="checkbox" id="componentNegotiable"> Négociable</label>
      </div>
      <div class="field">
        <label><input type="checkbox" id="componentAvailable" checked> Disponible</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btnCancelComponentModal">Annuler</button>
        <button type="submit" class="btn btn-primary" id="btnSaveComponent">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay hidden" id="categoryModalOverlay">
  <div class="modal">
    <h2>Catégories de composants</h2>
    <ul class="kv-list" id="categoryList"></ul>
    <form id="categoryForm" style="margin-top:16px; display:flex; gap:8px;">
      <input type="text" id="newCategoryName" placeholder="Nouvelle catégorie…" style="flex:1; padding:10px; border:1px solid var(--line); border-radius:4px; background:var(--paper); color:var(--ink);">
      <button type="submit" class="btn btn-primary">Ajouter</button>
    </form>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btnCloseCategoryModal">Fermer</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/admin-guard.js"></script>
<script src="../assets/js/admin-components.js"></script>
</body>
</html>
