<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes conversations — Build.Tech</title>
<meta name="theme-color" content="#10233A">
<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./assets/css/style.css">
<script>
  (function(){ var p=localStorage.getItem("buildtech-theme")||"system";
  var r=p==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):p;
  document.documentElement.setAttribute("data-theme", r); })();
</script>
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="./index.html" class="brand">
      <img src="./assets/img/logo-placeholder.svg" alt="Logo Build.Tech">
      Build<span class="dot">.</span>Tech
    </a>
    <ul class="nav-links">
      <li><a href="./index.html">Accueil</a></li>
      <li><a href="./services.html">Services</a></li>
      <li><a href="./components.html">Composants</a></li>
      <li><a href="./contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <button type="button" class="icon-btn" id="btnThemeToggle" title="Changer de thème" aria-label="Changer de thème">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div id="navAuthArea" class="nav-actions"></div>
      <button type="button" class="icon-btn nav-toggle" id="btnMobileNavToggle" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
  <div class="nav-mobile-panel" id="mobileNavPanel">
    <a href="./index.html">Accueil</a>
    <a href="./services.html">Services</a>
    <a href="./components.html">Composants</a>
    <a href="./contact.html">Contact</a>
    <div id="navAuthAreaMobile" style="display:flex; gap:8px; margin-top:10px;"></div>
  </div>
</header>

<main>
  <section class="section" style="padding-top:40px;">
    <div class="container">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:18px;">
        <h1 style="font-size:1.6rem; margin:0;">Mes conversations</h1>
        <button type="button" class="btn btn-ghost btn-sm" id="btnEnablePush">🔔 Activer les notifications</button>
      </div>

      <div class="chat-layout">
        <div class="chat-list" id="chatList">
          <div class="loading-row" style="padding:16px;"><span class="spinner"></span> Chargement…</div>
        </div>
        <div class="chat-thread" id="chatThread">
          <div class="empty-state">
            <div class="icon">💬</div>
            <p>Sélectionnez une conversation pour l'ouvrir.</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./assets/js/config.js"></script>
<script src="./assets/js/supabase-client.js"></script>
<script src="./assets/js/utils.js"></script>
<script src="./assets/js/theme.js"></script>
<script src="./assets/js/nav.js"></script>
<script src="./assets/js/auth-guard.js"></script>
<script src="./assets/js/chat-core.js"></script>
<script src="./assets/js/push.js"></script>
<script src="./assets/js/chat.js"></script>
</body>
</html>
